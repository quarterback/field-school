name: Publish East Detroit student readings

on:
  push:
    paths:
      - "east-detroit/student-edition/src/**"
      - "east-detroit/student-edition/build_fast.py"
      - "east-detroit/student-edition/figures/**"
      - ".github/workflows/east-detroit-student-readings.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document libraries
        run: python -m pip install "pypandoc_binary>=1.16" "weasyprint>=68,<69" "python-docx>=1.1,<2"
      - name: Remove superseded reading copies
        run: rm -f east-detroit/student-edition/dist/*.docx east-detroit/student-edition/dist/*.pdf
      - name: Build Word and PDF readings
        run: python east-detroit/student-edition/build_fast.py
      - name: Verify output count
        run: |
          test "$(find east-detroit/student-edition/dist -maxdepth 1 -name '*.docx' | wc -l)" -eq 6
          test "$(find east-detroit/student-edition/dist -maxdepth 1 -name '*.pdf' | wc -l)" -eq 6
      - name: Commit reading copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A east-detroit/student-edition/dist
          if ! git diff --cached --quiet; then
            git commit -m "Publish East Detroit student Word and PDF readings [skip ci]"
            git pull --rebase origin main
            git push
          fi
