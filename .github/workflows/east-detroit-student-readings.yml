name: Publish East Detroit student readings

on:
  push:
    paths:
      - "east-detroit/student-edition/src/**"
      - "east-detroit/student-edition/build.py"
      - "east-detroit/student-edition/figures/**"
      - ".github/workflows/east-detroit-student-readings.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install document tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer fonts-dejavu-core
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Word tools
        run: python -m pip install "python-docx>=1.1,<2"
      - name: Build Word and PDF readings
        run: python east-detroit/student-edition/build.py
      - name: Check file outputs
        run: |
          test "$(find east-detroit/student-edition/dist -maxdepth 1 -name '*.docx' | wc -l)" -eq 6
          test "$(find east-detroit/student-edition/dist -maxdepth 1 -name '*.pdf' | wc -l)" -eq 6
      - name: Commit reading copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add east-detroit/student-edition/dist
          if ! git diff --cached --quiet; then
            git commit -m "Publish edited East Detroit student Word and PDF readings [skip ci]"
            git push
          fi
